<!DOCTYPE html>
<html>
<head>
    <title>SND Loading Screen</title>
    <style>
        body { margin:0; padding:0; overflow:hidden; background: black; font-family: 'Segoe UI', Verdana, sans-serif; color: white; text-transform: uppercase; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; object-fit: cover; filter: brightness(0.3) blur(4px); transform: scale(1.1); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.9) 100%); }
        .content { position: absolute; left: 80px; bottom: 120px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .gamemode { font-size: 28px; color: #ffb400; font-weight: 800; letter-spacing: 3px; margin-bottom: -10px; }
        #mapname { font-size: 130px; font-weight: 900; font-style: italic; letter-spacing: -6px; line-height: 0.9; }
        .factions { font-size: 26px; font-weight: 700; margin-top: 15px; opacity: 0.7; }
        .details { position: absolute; right: 80px; top: 60px; text-align: right; opacity: 0.4; font-size: 14px; letter-spacing: 1px; line-height: 1.6; }
        .footer { position: fixed; bottom: 60px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .bar-bg { width: 400px; height: 4px; background: rgba(255,255,255,0.1); overflow: hidden; border-radius: 2px; }
        #bar { width: 0%; height: 100%; background: #ffb400; transition: width 0.3s; box-shadow: 0 0 15px rgba(255,180,0,0.5); }
        #status { margin-top: 15px; font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #aaaaaa; }
    </style>
</head>
<body>
    <div id="bg_container"></div>
    <div class="overlay"></div>
    <div class="details">
        SERVER: <span id="servername">...</span><br>
        PLAYER ID: <span id="steamid">...</span><br>
        SLOTS: <span id="slots">0/0</span>
    </div>
    <div class="content">
        <div class="gamemode">SEARCH AND DESTROY</div>
        <div id="mapname">LOADING...</div>
        <div class="factions">FACTION SELECTION IN PROGRESS</div>
    </div>
    <div class="footer">
        <div class="bar-bg"><div id="bar"></div></div>
        <div id="status">ESTABLISHING UPLINK...</div>
    </div>

    <script type="text/javascript">
        // GMod Engine Call
        function GameDetails( servername, serverurl, mapname, maxplayers, steamid, gamemode ) {
            document.getElementById('servername').innerText = servername;
            document.getElementById('mapname').innerText = mapname.toUpperCase();
            document.getElementById('steamid').innerText = steamid;
            document.getElementById('slots').innerText = maxplayers + " MAX";
        }

        // Percentage downloaded (0-100)
        function SetFilesNeeded( needed ) { totalFiles = needed; }
        function SetFilesRemaining( remaining ) {
            var diff = totalFiles - remaining;
            var proc = (diff / totalFiles) * 100;
            document.getElementById('bar').style.width = proc + "%";
        }

        // Status text update
        function SetStatusChanged( status ) {
            document.getElementById('status').innerText = status.toUpperCase();
        }
    </script>
</body>
</html>
